name: Build & Release APK

on:
  push:
    tags:
      - 'v*'                # 推送 v1.0.0 这类 tag 时自动触发
  workflow_dispatch:        # 也支持在 Actions 页面手动运行

permissions:
  contents: write           # 允许创建 Release 和上传文件

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'          # 项目要求 JDK 21

      # 项目没有 Gradle Wrapper，用 setup-gradle 提供 Gradle 环境
      # 如果仓库里有 gradlew，它会优先使用 wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5'       # 项目要求 Gradle >= 9.5

      # Miuix 依赖托管在 GitHub Packages，需要凭证才能解析
      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          gpr.user=${{ github.actor }}
          gpr.key=${{ secrets.GITHUB_TOKEN }}
          EOF

      # 如果配置了签名 Secrets，就还原 Keystore 并生成 keystore.properties
      # 没有配置签名时会跳过，构建出 unsigned Release APK
      - name: Decode Keystore and create signing config
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > ${{ github.workspace }}/release-key.jks
          cat > ${{ github.workspace }}/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Release APK
        run: gradle assembleRelease

      # 用通配符匹配，无论输出是 app-release.apk 还是 app-release-unsigned.apk 都能被捕获
      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      # 发布到 GitHub Releases
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
