name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # 修改点：去掉了强制指定的 9.5 版本，让 setup-gradle 自动读取并使用项目的 gradlew
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure GitHub Packages credentials
        run: |
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<EOF
          gpr.user=${{ github.actor }}
          gpr.key=${{ secrets.GITHUB_TOKEN }}
          EOF

      - name: Decode Keystore and create signing config
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/release-key.jks
            cat > ${{ github.workspace }}/keystore.properties <<EOF
          storeFile=${{ github.workspace }}/release-key.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "✅ 签名配置已生成。"
          else
            echo "⚠️ 未检测到签名 Secrets，将编译 unsigned Release 版本。"
          fi
        shell: bash

      # 修改点：使用 ./gradlew 执行构建，它会自动使用项目自带的 Gradle 版本
      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
